[package]
name = "pointless"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven X11 cursor utility that makes pointing devices pointless"
license = "MIT"
repository = "https://github.com/user/pointless"
readme = "README.md"
keywords = ["x11", "cursor", "keyboard", "navigation", "accessibility"]
categories = ["accessibility", "command-line-utilities", "gui"]
authors = ["Pointless Team"]

[[bin]]
name = "pointless"
path = "src/main.rs"

# Dependencies for the main binary
[dependencies]
x11 = "2.21"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"
image = "0.24"
rand = "0.8"

[lib]
name = "pointless"
path = "src/lib.rs"

[build-dependencies]
pkg-config = "0.3"

[features]
default = []
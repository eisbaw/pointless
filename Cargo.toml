[workspace]
members = [
    "crates/pointless-x11",
    "crates/pointless-grids", 
    "crates/pointless-input",
    "crates/pointless-render",
    "crates/pointless-app"
]
resolver = "2"

# Main application package for backwards compatibility
[package]
name = "pointless"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven X11 cursor utility that makes pointing devices pointless"
license = "MIT"
repository = "https://github.com/user/pointless"

[[bin]]
name = "pointless"
path = "src/main.rs"

# Dependencies for the main binary (keep original functionality for compatibility)
[dependencies]
x11 = "2.21"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"

[lib]
name = "pointless"
path = "src/lib.rs"

[build-dependencies]
pkg-config = "0.3"

[features]
default = ["basic-grids"]
basic-grids = []
vision-grids = ["opencv"]

[dependencies.opencv]
version = "0.92"
optional = true